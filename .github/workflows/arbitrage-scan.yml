name: Arbitrage Scanner

on:
  push:
    branches: [master]
    paths:
      - "arbitrage/**"
      - ".github/workflows/arbitrage-scan.yml"
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbitrage-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -q requests brotli

      - name: Run scanner
        run: python ci_scan.py
        working-directory: arbitrage
        env:
          STEAM_BUDGET: "100"
          STEAM_DELAY: "3.0"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arbitrage/data.json arbitrage/cache/steam_prices.json
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "arb scan: data update [skip ci]"
            git push
          fi
