name: pages
on:
  push:
    branches: [master]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  pages: write
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          RESP=$(gh api --method POST /repos/$REPO/pages -f "source[branch]=master" -f "source[path]=/dashboard" 2>&1)
          CODE=$?
          printf '%s' "$RESP" > pages-debug.txt
          echo "exit=$CODE"
          cat pages-debug.txt
          if [ $CODE -ne 0 ]; then
            RESP2=$(gh api --method PATCH /repos/$REPO/pages -f "source[branch]=master" -f "source[path]=/dashboard" 2>&1)
            printf '\nPATCH: %s' "$RESP2" >> pages-debug.txt
            cat pages-debug.txt
          fi
          exit 0
      - name: Commit debug
        run: |
          git config user.name "pm-bot"
          git config user.email "bot@users.noreply.github.com"
          mv pages-debug.txt results/pages-debug.txt || true
          git add results/pages-debug.txt || true
          git diff --cached --quiet || (git commit -m "chore: pages enable debug [skip ci]" && git fetch origin && git rebase origin/master && git push origin HEAD:master)
