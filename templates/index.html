<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Polymarket Pro Terminal</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #0f0f0f;
            --primary: #0ea5e9;
            --accent: #10b981;
            --text: #e2e8f0;
            --muted: #64748b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 30px; }
        .container { max-width: 1200px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.025em; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .card { background: var(--surface); padding: 24px; border-radius: 12px; border: 1px solid #1f2937; }
        .label { color: var(--muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .value { font-size: 1.8rem; font-weight: 700; margin-top: 8px; color: var(--primary); }
        .terminal { background: #000; padding: 20px; border-radius: 12px; border: 1px solid #333; font-family: 'Courier New', monospace; height: 300px; overflow-y: auto; margin-top: 20px; }
        .log-entry { margin-bottom: 5px; color: #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>POLYMARKET <span>PRO TERMINAL</span></h1>
            <div id="status" style="color: var(--accent)">● LIVE</div>
        </header>
        
        <div class="grid">
            <div class="card">
                <div class="label">Balance</div>
                <div class="value" id="balance">$1000.00</div>
            </div>
            <div class="card">
                <div class="label">Active Markets</div>
                <div class="value" id="markets">5</div>
            </div>
            <div class="card">
                <div class="label">Win Rate</div>
                <div class="value">N/A</div>
            </div>
            <div class="card">
                <div class="label">Lab Status</div>
                <div class="value" style="color: var(--accent)">OPTIMIZED</div>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <div class="label">Strategy Parameters</div>
            <pre id="strategy" style="color: #f59e0b; margin-top: 10px;">Loading...</pre>
        </div>

        <div class="terminal" id="logs">
            <div class="log-entry">[02:48:12] Initializing Lab Engine...</div>
            <div class="log-entry">[02:48:13] Connected to Polymarket API...</div>
            <div class="log-entry">[02:48:15] Strategy optimization complete.</div>
            <div class="log-entry">[02:48:16] Waiting for volatility signal...</div>
        </div>
    </div>
    <script>
        async function update() {
            const res = await fetch('/api/data');
            const data = await res.json();
            document.getElementById('balance').innerText = '$' + data.balance.toFixed(2);
            document.getElementById('strategy').innerText = JSON.stringify(data.strategy, null, 2);
        }
        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
